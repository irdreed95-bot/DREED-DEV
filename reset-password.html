<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تغيير كلمة المرور — DREED DEV</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <a class="brand" href="index.html"><span class="brand-mark">D</span><span>DREED<span class="accent">.</span>DEV</span></a>
    <p class="eyebrow">ACCOUNT SECURITY</p>
    <h1>تغيير كلمة المرور</h1>
    <p id="resetHint">أدخل كلمة المرور الجديدة لحسابك.</p>

    <form id="resetForm">
      <label>كلمة المرور الجديدة
        <input id="newPassword" type="password" minlength="6" required placeholder="••••••••" autocomplete="new-password">
      </label>
      <label>تأكيد كلمة المرور
        <input id="confirmPassword" type="password" minlength="6" required placeholder="••••••••" autocomplete="new-password">
      </label>
      <button class="btn btn-primary" type="submit">حفظ كلمة المرور</button>
      <a class="auth-switch" href="auth.html">رجوع لتسجيل الدخول</a>
      <div id="resetMsg" class="form-msg" role="status" aria-live="polite"></div>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="reset-password.js"></script>
</body>
</html>
