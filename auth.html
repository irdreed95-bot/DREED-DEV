<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول — DREED DEV</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <a class="brand" href="index.html"><span class="brand-mark">D</span><span>DREED<span class="accent">.</span>DEV</span></a>
    <p class="eyebrow">CLIENT ACCOUNT</p>
    <h1 id="authTitle">دخول العميل</h1>
    <p id="authHint">سجّل دخولك حتى تتابع طلباتك.</p>

    <form id="authForm">
      <label id="fullNameWrap">الاسم<input id="fullName" placeholder="اسمك الكامل" autocomplete="name"></label>
      <label>الإيميل<input id="email" type="email" required placeholder="name@email.com" autocomplete="email"></label>
      <label>كلمة المرور<input id="password" type="password" minlength="6" required placeholder="••••••••" autocomplete="current-password"></label>

      <button class="btn btn-primary" type="submit">دخول</button>
      <button class="auth-switch" type="button" id="switchAuth">ما عندي حساب — إنشاء حساب</button>
      <button class="auth-switch" type="button" id="forgotPassword">نسيت كلمة المرور؟</button>
      <button class="auth-switch" type="button" id="resendConfirm">إعادة إرسال رابط تأكيد الإيميل</button>
      <div id="authMsg" class="form-msg" role="status" aria-live="polite"></div>
    </form>

    <form id="recoveryForm" style="display:none">
      <label>كلمة المرور الجديدة
        <input id="newPassword" type="password" minlength="6" required placeholder="••••••••" autocomplete="new-password">
      </label>
      <label>تأكيد كلمة المرور
        <input id="confirmPassword" type="password" minlength="6" required placeholder="••••••••" autocomplete="new-password">
      </label>
      <button class="btn btn-primary" type="submit">حفظ كلمة المرور</button>
      <button class="auth-switch" type="button" id="backToLogin">رجوع لتسجيل الدخول</button>
      <div id="recoveryMsg" class="form-msg" role="status" aria-live="polite"></div>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
</body>
</html>
